# Tema "Solicitar descuento" — vista de código de Copilot Studio.
# Uso: Temas → + Agregar tema → Desde cero → menú "..." → Abrir editor de código → pegar.
# IMPORTANTE: antes de pegar, creá el Flujo A desde este mismo tema (Agregar nodo → Agregar herramienta →
# Nuevo flujo de agente) para que Copilot Studio genere el flowId y los nombres de entrada/salida.
# Luego reemplazá REEMPLAZAR_FLOW_ID y ajustá los nombres de los parámetros si difieren.
# El esquema YAML de Copilot Studio cambia entre versiones: si algo no valida, armá el tema en el
# lienzo siguiendo esta misma lógica.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Solicitar descuento
    triggerQueries:
      - Quiero pedir un descuento para un cliente
      - Necesito aprobación para un descuento
      - El cliente pide un 20 % de descuento
      - Puedo hacer un descuento especial
      - Solicitar descuento corporativo

  actions:
    - kind: Question
      id: preguntarCliente
      variable: init:Topic.Cliente
      prompt: ¿Para qué cliente o empresa es el descuento?
      entity: StringPrebuiltEntity

    - kind: Question
      id: preguntarMonto
      variable: init:Topic.MontoBase
      prompt: ¿Cuál es el precio de lista mensual en ARS de lo que vas a cotizar?
      entity: NumberPrebuiltEntity

    - kind: Question
      id: preguntarDescuento
      variable: init:Topic.Descuento
      prompt: ¿Qué porcentaje de descuento querés ofrecer? (sólo el número, por ejemplo 15)
      entity: NumberPrebuiltEntity

    - kind: ConditionGroup
      id: validarTope
      conditions:
        - id: fueraDePolitica
          condition: =Topic.Descuento > 25
          actions:
            - kind: SendActivity
              id: avisoFueraDePolitica
              activity: Un descuento mayor a 25 % no está permitido por la política comercial. Te sugiero proponer otro plan o modalidad (por ejemplo, pases corporativos por volumen).
            - kind: EndDialog
              id: finFueraDePolitica

    - kind: Question
      id: preguntarJustificacion
      variable: init:Topic.Justificacion
      prompt: Contame brevemente la justificación comercial (volumen, competencia, renovación, convenio…).
      entity: StringPrebuiltEntity

    - kind: InvokeFlowAction
      id: registrarSolicitud
      input:
        binding:
          Pregunta: =Concatenate("Solicitud de descuento de ", Text(Topic.Descuento), " % para ", Topic.Cliente)
          TipoConsulta: Descuento
          Cliente: =Topic.Cliente
          MontoBase: =Topic.MontoBase
          DescuentoSolicitado: =Topic.Descuento
          Justificacion: =Topic.Justificacion
          VendedorEmail: =System.User.Email
      output:
        binding:
          IdConsulta: Topic.IdConsulta
          Estado: Topic.Estado
      flowId: REEMPLAZAR_FLOW_ID

    - kind: ConditionGroup
      id: informarResultado
      conditions:
        - id: requiereAprobacion
          condition: =Topic.Estado = "Pendiente de aprobación"
          actions:
            - kind: SendActivity
              id: avisoPendiente
              activity: "Registré la solicitud #{Topic.IdConsulta}. Como supera el 10 %, se la envié a Coordinación Comercial. Te aviso por Teams cuando la resuelvan (objetivo: 2 días hábiles)."
      elseActions:
        - kind: SendActivity
          id: avisoAutomatico
          activity: "Registré la solicitud #{Topic.IdConsulta}. Un descuento de hasta 10 % lo podés aplicar sin aprobación. Recordá que no es acumulable con el 10 % de pago anticipado."
